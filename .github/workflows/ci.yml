name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/verve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/verve/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:ssr

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Boot check
        # Boots the server against dummy env values just to confirm it starts without
        # crashing (no real Mongo/Postgres/Stripe needed for this) — not a full test suite.
        run: |
          MONGO_URI=mongodb://localhost:27017/ci JWT_SECRET=ci-secret timeout 10 node server.js &
          sleep 3
          curl -sf http://localhost:5000/api/health

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routes (e.g. /dashboard) don't exist as real files, so
    # any unmatched path serves index.html and React Router takes over from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

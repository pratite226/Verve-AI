<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Blocking and inline so it runs before first paint — sets data-theme on <html>
      // (outside the #root tree React hydrates, so this can never cause a hydration
      // mismatch) ahead of any CSS painting, avoiding a flash of the wrong theme on load.
      // ThemeContext (src/context/ThemeContext.jsx) reads this same attribute back as its
      // initial state once React mounts. Resolution order: saved localStorage["verve.theme"]
      // → OS prefers-color-scheme → dark (the brand default for a first-time visitor).
      (function () {
        try {
          var stored = localStorage.getItem("verve.theme");
          var theme;
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
            theme = "light";
          } else {
            theme = "dark";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verve AI — Your AI-Powered Personal Branding Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Google Identity Services — registers window.google.accounts.id. Loaded unconditionally
         (cheap, does nothing until initialized) so GoogleSignInButton.jsx never has to worry
         about injecting a <script> tag itself; it just waits for this to be ready. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
